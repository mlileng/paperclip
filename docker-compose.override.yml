services:
  db:
    restart: unless-stopped
  server:
    # Local `start.sh --build` builds+tags this locally; docker-upgrade.sh
    # instead `pull`s the CI-built image from GHCR for this same tag.
    image: ghcr.io/mlileng/paperclip-server:${PAPERCLIP_VERSION:-dev}
    restart: unless-stopped
    environment:
      GH_TOKEN: "${GH_TOKEN:-}"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      CLAUDE_CODE_OAUTH_REFRESH_TOKEN: "${CLAUDE_CODE_OAUTH_REFRESH_TOKEN:-}"
      PAPERCLIP_TOOL_OAUTH_MCP_RUNWITHMORT_COM_CLIENT_ID: "${PAPERCLIP_TOOL_OAUTH_MCP_RUNWITHMORT_COM_CLIENT_ID:-}"
      PAPERCLIP_TOOL_OAUTH_MCP_RUNWITHMORT_COM_CLIENT_SECRET: "${PAPERCLIP_TOOL_OAUTH_MCP_RUNWITHMORT_COM_CLIENT_SECRET:-}"
