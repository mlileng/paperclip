name: Build deploy image

# Builds and publishes the server image whenever deploy changes, so
# docker-upgrade.sh on the deploy machine can `docker pull` a pre-built
# image instead of building locally (the local host doesn't have enough
# RAM to build alongside the live containers - see paperclip-deployment's
# README for the history).

on:
  push:
    branches: [deploy]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mlileng/paperclip-server

jobs:
  build:
    # Native arm64 runner: docker-upgrade.sh runs on an Apple Silicon Mac,
    # and this is the only deploy target today, so build for that platform
    # directly rather than QEMU-emulating arm64 on an x86 runner (far
    # slower for a build this heavy - Rust toolchain + a large pnpm install).
    # Revisit with a platforms matrix if an amd64 deploy target shows up.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # short SHA to match docker-upgrade.sh's `git rev-parse --short HEAD`
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:deploy-latest
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (first push only, harmless if already public)
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/paperclip-server \
            -f visibility=public || echo "Could not set visibility automatically - set it manually once at https://github.com/users/mlileng/packages/container/paperclip-server/settings"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
